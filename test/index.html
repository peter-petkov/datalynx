<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autocomplete test</title>
    <link rel="stylesheet" href="../src/atmosAutocomplete.css">
    <link rel="stylesheet" href="./index.css">
    <script type="importmap"> { "imports": { "redom": "https://cdnjs.cloudflare.com/ajax/libs/redom/3.17.0/redom.es.min.js" } }</script>
</head>
<body>
<label>
    Atmos autocomplete
    <span class="input-wrapper">
        <input data-toggle="autocomplete" list="test">
    </span>
    <datalist id="test">
        <option disabled title="Explanation 1">Select an option</option>
        <option title="Explanation 1" value="test">A</option>
        <optgroup label="Optgroup 1">
            <option>Aa</option>
            <option>B</option>
        </optgroup>
        <optgroup label="Optgroup 2">
            <option>C</option>
            <option>D</option>
        </optgroup>
        <option>E</option>
    </datalist>
</label>
<script type="module" src="../dist/atmosAutocomplete.js"></script>
</body>
</html>
