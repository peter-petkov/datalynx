<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datalynx</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<header class="topbar">
    <span class="brand">Datalynx</span>
    <span class="status">work in progress</span>
</header>

<main>
    <section id="getting-started">
        <h1>Datalynx</h1>
        <p>A searchable suggestions popover for an <code>&lt;input&gt;</code> with a <code>&lt;datalist&gt;</code>, sibling of Platypicker. Nothing is built yet: the field below is the browser's own datalist, the baseline Datalynx enhances.</p>

        <div class="stage">
            <label for="fruit">Fruit</label>
            <input id="fruit" name="fruit" list="fruits" autocomplete="off">
            <datalist id="fruits">
                <option value="Apple">🍎</option>
                <option value="Banana">🍌</option>
                <option value="Cherry">🍒</option>
                <option value="Grapes">🍇</option>
                <option value="Lemon">🍋</option>
                <option value="Mango">🥭</option>
                <option value="Orange">🍊</option>
                <option value="Peach">🍑</option>
                <option value="Pear">🍐</option>
                <option value="Pineapple">🍍</option>
                <option value="Strawberry">🍓</option>
                <option value="Watermelon">🍉</option>
            </datalist>
        </div>
    </section>
</main>
</body>
</html>
